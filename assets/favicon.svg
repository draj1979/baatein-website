<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Smartleads robot logo">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a6dea"/>
      <stop offset="1" stop-color="#3342b0"/>
    </linearGradient>
  </defs>
  <!-- antenna -->
  <line x1="32" y1="11" x2="32" y2="5.5" stroke="#3f52c5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="4.5" r="3.6" fill="#25d366"/>
  <!-- ears -->
  <rect x="2.5" y="28" width="7" height="14" rx="3.5" fill="#3f52c5"/>
  <rect x="54.5" y="28" width="7" height="14" rx="3.5" fill="#3f52c5"/>
  <!-- head with a chat-bubble tail -->
  <path d="M14 12h36a9 9 0 0 1 9 9v22a9 9 0 0 1-9 9H29.5L21 60.5V52h-7a9 9 0 0 1-9-9V21a9 9 0 0 1 9-9z" fill="url(#head)"/>
  <!-- face plate -->
  <rect x="11" y="19" width="42" height="27" rx="13.5" fill="#f4f6ff"/>
  <!-- eyes -->
  <ellipse cx="23.5" cy="31" rx="5" ry="5.8" fill="#141a2e"/>
  <ellipse cx="40.5" cy="31" rx="5" ry="5.8" fill="#141a2e"/>
  <circle cx="25.4" cy="28.6" r="1.9" fill="#fff"/>
  <circle cx="42.4" cy="28.6" r="1.9" fill="#fff"/>
  <circle cx="22.4" cy="33" r="0.9" fill="#fff" opacity="0.8"/>
  <circle cx="39.4" cy="33" r="0.9" fill="#fff" opacity="0.8"/>
  <!-- cheeks and smile -->
  <ellipse cx="16.5" cy="38.5" rx="3.2" ry="2" fill="#ff9db1" opacity="0.7"/>
  <ellipse cx="47.5" cy="38.5" rx="3.2" ry="2" fill="#ff9db1" opacity="0.7"/>
  <path d="M27 39.2c1.4 2.4 3.1 3.4 5 3.4s3.6-1 5-3.4" fill="none" stroke="#141a2e" stroke-width="2.2" stroke-linecap="round"/>
</svg>
